<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 驱动的自动化平台</title>
  <meta name="description" content="基于目标探索网站场景，自主规划与实施，交付可追溯的结果">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js?v=20261116-workspace" defer></script><script src="/sourcing.js?v=20261116-workspace" defer></script><script src="/platform.js?v=20261116-workspace" defer></script><script src="/agents.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/?view=operations" aria-label="AI 驱动的自动化平台">AI 驱动的自动化平台</a>
    <div class="topbar-context">工作空间 / 任务总览</div>
    <button class="text-btn" data-nav="attention" id="attention-indicator">待办</button><div class="connection" id="connection" role="status">正在连接服务</div>
  </header>
  <div id="service-status-alert" role="alert" hidden></div>
  <div id="task-blocker-alert" role="alert" aria-live="polite" hidden></div>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="主导航">
        <div class="nav-group"><div class="nav-caption">工作空间</div>
          <button class="nav-item" data-nav="operations" data-icon="briefcase">今天</button>
          <button class="nav-item" data-nav="tasks" data-icon="play">任务</button>
          <button class="nav-item" data-nav="attention" data-icon="check">待办 <span id="todo-count"></span></button>
          <button class="nav-item" data-nav="sourcing" data-icon="search">岗位</button>
        </div>
        <div class="nav-group"><div class="nav-caption">平台管理</div>
          <button class="nav-item" data-nav="environments" data-icon="link">执行环境</button>
        </div>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-nav="settings" data-icon="settings">系统设置</button>
        <div class="nav-group nav-advanced"><button class="nav-toggle" type="button" data-nav-advanced aria-expanded="false" aria-controls="nav-advanced-items">高级</button>
          <div class="nav-advanced-items" id="nav-advanced-items" hidden>
            <button class="nav-item" data-nav="templates" data-icon="briefcase">场景模板</button>
            <button class="nav-item" data-nav="planner" data-icon="messages">规划端</button>
            <button class="nav-item" data-nav="executor" data-icon="history">执行端</button>
          </div>
        </div><div class="local-context"><span class="status-dot"></span>本机工作空间</div></div>
    </aside>
    <main id="content" aria-label="工作区"><div class="loading">正在加载工作台</div></main>
  </div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
