[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -nopw -rfbport 5900
priority=20
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:browser-view]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:workbench]
command=cloakup web --root /data --port 8765
priority=40
autorestart=true
stopwaitsecs=25
stopasgroup=false
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
